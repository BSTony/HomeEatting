<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏮 家宴跨螢幕同步互動系統</title>
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    .portal-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      z-index: 1;
    }

    .portal-card {
      width: 100%;
      max-width: 580px;
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .portal-logo {
      font-size: 56px;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 12px var(--accent-gold-glow));
    }

    .portal-title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .portal-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .entry-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .entry-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-primary);
      transition: all var(--transition-bounce);
      cursor: pointer;
    }

    .entry-card:hover {
      transform: translateY(-3px);
      background: rgba(245, 158, 11, 0.1);
      border-color: var(--accent-gold);
      box-shadow: 0 8px 24px var(--accent-gold-glow);
    }

    .entry-card.primary {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(239, 68, 68, 0.1));
      border-color: rgba(245, 158, 11, 0.4);
    }

    .entry-info {
      text-align: left;
    }

    .entry-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .entry-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    .entry-arrow {
      font-size: 20px;
      color: var(--accent-gold);
      transition: transform var(--transition-fast);
    }

    .entry-card:hover .entry-arrow {
      transform: translateX(4px);
    }

    .portal-features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .feature-item {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .feature-icon {
      font-size: 20px;
    }

    @media (max-width: 480px) {
      .portal-card {
        padding: 28px 20px;
      }
      .portal-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="portal-container">
    <div class="portal-card">
      <div class="portal-logo">🏮</div>
      <h1 class="portal-title">闔家盛宴・跨螢幕同步互動系統</h1>
      <p class="portal-subtitle">主控端即時切換畫面與選單，從屬端即時鏡像同步與參與作答</p>

      <div class="entry-grid">
        <!-- Slave Entry (Default for Guests on Mobile) -->
        <a href="/slave.html" class="entry-card primary">
          <div class="entry-info">
            <div class="entry-title">
              <span>📱</span>
              <span>進入從屬端（賓客手機）</span>
            </div>
            <div class="entry-desc">同步主控畫面、即時菜單點選、人氣票選與抽獎</div>
          </div>
          <span class="entry-arrow">➔</span>
        </a>

        <!-- Master Entry -->
        <a href="/master.html" class="entry-card">
          <div class="entry-info">
            <div class="entry-title">
              <span>👑</span>
              <span>進入主控台（操作指揮）</span>
            </div>
            <div class="entry-desc">切換投影片、開放/鎖定選項、檢視即時統計與開獎</div>
          </div>
          <span class="entry-arrow">➔</span>
        </a>
      </div>

      <div class="portal-features">
        <div class="feature-item">
          <span class="feature-icon">⚡</span>
          <span>極低延遲同步</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">🗳️</span>
          <span>多種互動模式</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">☁️</span>
          <span>支援 Render 雲端</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
